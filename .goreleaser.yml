version: 2

project_name: sumup

release:
  prerelease: auto
  replace_existing_artifacts: true

before:
  hooks:
    - go mod download
    - mkdir -p completions
    - sh -c "go run ./cmd/sumup completion bash > completions/sumup.bash"
    - sh -c "go run ./cmd/sumup completion zsh > completions/sumup.zsh"
    - sh -c "go run ./cmd/sumup completion fish > completions/sumup.fish"
    - sh -c "go run ./cmd/sumup manpages -o man"

builds:
  - id: macos
    main: ./cmd/sumup/main.go
    binary: sumup
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/sumup/sumup-cli/internal/buildinfo.Version={{ .Version }} -X github.com/sumup/sumup-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/sumup/sumup-cli/internal/buildinfo.Date={{ .Date }}

  - id: linux
    main: ./cmd/sumup/main.go
    binary: sumup
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    ldflags:
      - -s -w -X github.com/sumup/sumup-cli/internal/buildinfo.Version={{ .Version }} -X github.com/sumup/sumup-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/sumup/sumup-cli/internal/buildinfo.Date={{ .Date }}

  - id: windows
    main: ./cmd/sumup/main.go
    binary: sumup
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ldflags:
      - -s -w -X github.com/sumup/sumup-cli/internal/buildinfo.Version={{ .Version }} -X github.com/sumup/sumup-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/sumup/sumup-cli/internal/buildinfo.Date={{ .Date }}

archives:
  - id: linux-archive
    ids: [linux]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_linux_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*/*
  - id: macos-archive
    ids: [macos]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_macOS_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*/*
  - id: windows-archive
    ids: [windows]
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_windows_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*/*

checksum:
  name_template: checksums.txt

# Sign and notarize macOS binaries when Apple credentials are present.
# Homebrew installs require notarized binaries (no quarantine bypass in the cask).
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [macos]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"

# Publishes Casks/sumup.rb to the public tap sumup/homebrew-cli.
# Requires HOMEBREW_TAP_GITHUB_TOKEN with write access to that repository.
homebrew_casks:
  - name: sumup
    ids:
      - macos-archive
      - linux-archive
    repository:
      owner: sumup
      name: homebrew-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: "sumup-{{ .Version }}"
      pull_request:
        enabled: true
    homepage: https://developer.sumup.com
    description: Command line tool for interacting with SumUp APIs.
    license: Apache-2.0
    manpages:
      - man/man1/sumup.1.gz
    completions:
      bash: completions/sumup.bash
      zsh: completions/sumup.zsh
      fish: completions/sumup.fish
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
