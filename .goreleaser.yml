version: 2

project_name: sumup

release:
  prerelease: auto
  use_existing_draft: true

before:
  hooks:
    - go mod download
    - mkdir -p completions
    - sh -c "go run ./cmd/sumup completion bash > completions/sumup.bash"
    - sh -c "go run ./cmd/sumup completion zsh > completions/sumup.zsh"
    - sh -c "go run ./cmd/sumup completion fish > completions/sumup.fish"
    - sh -c "go run ./cmd/sumup manpages -o man"

builds:
  - id: macos
    main: ./cmd/sumup/main.go
    binary: sumup
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/sumup/sumup-cli/internal/buildinfo.Version={{ .Version }} -X github.com/sumup/sumup-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/sumup/sumup-cli/internal/buildinfo.Date={{ .Date }}

  - id: linux
    main: ./cmd/sumup/main.go
    binary: sumup
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    ldflags:
      - -s -w -X github.com/sumup/sumup-cli/internal/buildinfo.Version={{ .Version }} -X github.com/sumup/sumup-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/sumup/sumup-cli/internal/buildinfo.Date={{ .Date }}

  - id: windows
    main: ./cmd/sumup/main.go
    binary: sumup
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ldflags:
      - -s -w -X github.com/sumup/sumup-cli/internal/buildinfo.Version={{ .Version }} -X github.com/sumup/sumup-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/sumup/sumup-cli/internal/buildinfo.Date={{ .Date }}

    # Enable when signing credentials are configured in CI.
    # hooks:
    #   post:
    #     - cmd: >-
    #         {{ if eq .Os "darwin" }}./scripts/sign-macos.sh '{{ .Path }}'{{ else }}echo{{ end }}
    #       output: true
    #     - cmd: >-
    #         {{ if eq .Os "windows" }}pwsh ./scripts/sign-windows.ps1 '{{ .Path }}'{{ else }}echo{{ end }}
    #       output: true

archives:
  - id: linux-archive
    ids: [linux]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_linux_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*/*
  - id: macos-archive
    ids: [macos]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_macOS_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*/*
  - id: windows-archive
    ids: [windows]
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_windows_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*/*

checksum:
  name_template: checksums.txt

# Publishes Casks/sumup.rb to the public tap sumup/homebrew-cli.
# Requires HOMEBREW_TAP_GITHUB_TOKEN with write access to that repository.
homebrew_casks:
  - name: sumup
    ids:
      - macos-archive
      - linux-archive
    repository:
      owner: sumup
      name: homebrew-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: "sumup-{{ .Version }}"
      pull_request:
        enabled: true
    homepage: https://developer.sumup.com
    description: Command line tool for interacting with SumUp APIs.
    license: Apache-2.0
    # Binaries are not yet notarized; clear quarantine so Gatekeeper does not
    # block the unsigned CLI. Remove this hook once macOS signing is enabled.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sumup"]
          end
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
