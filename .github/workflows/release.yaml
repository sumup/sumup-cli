name: Release

# GitHub does not emit `release` events for draft releases, so we trigger on the
# tag that release-please pushes alongside the draft and let GoReleaser adopt it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release to build and publish, e.g. v0.3.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Wait for the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              | jq --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag and .draft)] | length')"
            if [ "${count}" -gt 0 ]; then
              echo "Found draft release for ${RELEASE_TAG}."
              exit 0
            fi
            echo "Draft release for ${RELEASE_TAG} not available yet (attempt ${attempt}/30)."
            sleep 10
          done
          echo "::error::No draft release found for ${RELEASE_TAG}. Assets cannot be uploaded to an already published release."
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
